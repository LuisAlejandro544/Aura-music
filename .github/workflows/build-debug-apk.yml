name: Compilar APK Debug (Aura Music - 3 Arquitecturas Móviles)

# Este flujo de trabajo se activa EXCLUSIVAMENTE de forma manual (workflow_dispatch)
# cumpliendo la directiva de no ejecutarse en cada commit automático.
# Genera y publica en Artifacts los 3 APKs móviles separados (arm64-v8a, armeabi-v7a y universal)
# junto con el archivo SHA256SUMS.txt, idéntico al esquema del APK Beta.
on:
  workflow_dispatch:
    inputs:
      enable_cache:
        description: 'Habilitar caché de dependencias Gradle y motores nativos'
        required: false
        type: boolean
        default: true
      force_rebuild_native:
        description: 'Forzar re-aprovisionamiento y compilación de motores nativos puros (CPython 3.11, FFmpeg, QuickJS y yt-dlp) desde Gradle'
        required: false
        type: boolean
        default: false
      force_new_keystore:
        description: 'Generar nueva firma debug desde cero (ADVERTENCIA: Si cambias la firma, deberás desinstalar la app previa en tu teléfono)'
        required: false
        type: boolean
        default: false

jobs:
  build-debug-apk:
    name: Compilación de 3 APKs Debug Móviles (arm64-v8a, armeabi-v7a y Universal) + Motores Nativos Puros
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Descargar todo el código del proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 3. Configurar Android SDK y Aceptar Licencias
        run: |
          echo "=== Configurando entorno Android SDK ==="
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          echo "Aceptando licencias del SDK..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 🛠️ 4. Instalar CMake, NDK y Herramientas de Compilación Nativa C++20
        run: |
          echo "=== Instalando herramientas de sistema y NDK ==="
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends file curl unzip tar xz-utils build-essential

          echo "Instalando CMake 3.22.1..."
          sdkmanager --install "cmake;3.22.1" || true

          echo "Instalando NDK de Android..."
          sdkmanager --install "ndk;28.2.13676358" || sdkmanager --install "ndk;25.1.8937393" || true

          NDK_PATH=$(ls -1vd "$ANDROID_HOME/ndk/"* 2>/dev/null | tail -n 1 || true)
          if [ -n "$NDK_PATH" ] && [ -d "$NDK_PATH" ]; then
            echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
            echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

            LLVM_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
            if [ -d "$LLVM_BIN" ]; then
              echo "$LLVM_BIN" >> $GITHUB_PATH
            fi
            echo "✅ NDK configurado para Gradle y CMake: $NDK_PATH"
          fi

      - name: 💾 5. Configurar Caché de Gradle y Dependencias Maven
        if: ${{ inputs.enable_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 💾 6. Verificar o Restaurar Caché de Motores Nativos Puros (FFmpeg, CPython 3.11, QuickJS, yt-dlp)
        if: ${{ inputs.enable_cache && !inputs.force_rebuild_native }}
        id: cache-native-deps
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/bin
          key: native-pure-mobile-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml', 'app/src/main/cpp/*') }}
          restore-keys: |
            native-pure-mobile-${{ runner.os }}-

      - name: 🔧 7. Preparar Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: 🔑 8. Verificar Firma de Depuración debug.keystore
        if: ${{ inputs.force_new_keystore }}
        run: |
          echo "⚠️ Forzando creación de nueva firma debug.keystore..."
          rm -f debug.keystore debug.keystore.base64
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AuraMusicDebug, OU=Engineering, O=AuraSound, L=Local, ST=State, C=US"
          base64 debug.keystore > debug.keystore.base64

      - name: ⚙️ 9. Ejecutar Aprovisionamiento Nativo Puro en Gradle (arm64-v8a y armeabi-v7a)
        if: steps.cache-native-deps.outputs.cache-hit != 'true' || inputs.force_rebuild_native == true
        env:
          AURA_SPLIT_APKS: "true"
          AURA_BETA_MOBILE_ONLY: "true"
        run: |
          echo "=== Limpiando residuos de arquitecturas de PC (x86 / x86_64) ==="
          rm -rf app/src/main/jniLibs/x86 app/src/main/jniLibs/x86_64
          echo "=== Ejecutando tarea Gradle :app:provisionNativeDeps (Cero .sh, Móvil 32/64 bits) ==="
          ./gradlew :app:provisionNativeDeps --no-daemon --rerun-tasks --stacktrace

      - name: 🔍 10. Auditar Binarios Nativos Puros Ensamblados (Multi-ABI Móvil y Assets)
        run: |
          rm -rf app/src/main/jniLibs/x86 app/src/main/jniLibs/x86_64
          echo "=== Auditoría de módulos JNI generados (app/src/main/jniLibs) ==="
          ls -lhR app/src/main/jniLibs/ || true
          echo ""
          echo "=== Auditoría de ejecutables en Assets (app/src/main/assets/bin) ==="
          ls -lh app/src/main/assets/bin/ || true

      - name: 🚀 11. Compilar los 3 APKs de Aura Music Debug (arm64-v8a, armeabi-v7a y Universal)
        env:
          AURA_SPLIT_APKS: "true"
          AURA_BETA_MOBILE_ONLY: "true"
        run: |
          echo "Iniciando compilación de los 3 APKs Debug (arm64-v8a, armeabi-v7a y universal)..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 📂 12. Organizar y Renombrar Estratégicamente los 3 APKs Debug + Sumas SHA-256
        run: |
          mkdir -p dist-debug
          echo "=== Localizando los 3 APKs generados en app/build/outputs/apk/debug/ ==="
          ls -lh app/build/outputs/apk/debug/

          ARM64_APK=$(find app/build/outputs/apk/debug -name "*arm64-v8a*.apk" | head -n 1)
          ARMV7_APK=$(find app/build/outputs/apk/debug -name "*armeabi-v7a*.apk" | head -n 1)
          UNIV_APK=$(find app/build/outputs/apk/debug -name "*universal*.apk" | head -n 1)

          if [ -z "$ARM64_APK" ] || [ -z "$ARMV7_APK" ] || [ -z "$UNIV_APK" ]; then
            echo "❌ Error: No se encontraron los 3 APKs Debug esperados."
            exit 1
          fi

          cp "$ARM64_APK" "dist-debug/AuraMusic-Debug-arm64-v8a.apk"
          cp "$ARMV7_APK" "dist-debug/AuraMusic-Debug-armeabi-v7a.apk"
          cp "$UNIV_APK"  "dist-debug/AuraMusic-Debug-universal.apk"

          cd dist-debug
          sha256sum *.apk > SHA256SUMS.txt
          echo "=== APKs Debug listos para Artifacts ==="
          ls -lh
          cat SHA256SUMS.txt

      - name: 📦 13A. Publicar APK Debug ARM 64-bits (arm64-v8a) en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Debug-arm64-v8a.apk
          path: dist-debug/AuraMusic-Debug-arm64-v8a.apk
          retention-days: 14
          if-no-files-found: error

      - name: 📦 13B. Publicar APK Debug ARM 32-bits (armeabi-v7a) en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Debug-armeabi-v7a.apk
          path: dist-debug/AuraMusic-Debug-armeabi-v7a.apk
          retention-days: 14
          if-no-files-found: error

      - name: 📦 13C. Publicar APK Debug Universal (32+64 bits) en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Debug-universal.apk
          path: dist-debug/AuraMusic-Debug-universal.apk
          retention-days: 14
          if-no-files-found: error

      - name: 📦 13D. Publicar Sumas SHA-256 Debug en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Debug-SHA256SUMS.txt
          path: dist-debug/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

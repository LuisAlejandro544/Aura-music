name: Compilar APK Debug (Aura Music)

# Este flujo de trabajo se activa EXCLUSIVAMENTE de forma manual (workflow_dispatch)
# cumpliendo la directiva de no ejecutarse en cada commit automático.
on:
  workflow_dispatch:
    inputs:
      enable_cache:
        description: 'Habilitar caché de dependencias Gradle'
        required: false
        type: boolean
        default: true
      force_new_keystore:
        description: 'Obligar a generar firma debug desde cero sin esperar ninguna'
        required: false
        type: boolean
        default: true

jobs:
  build-debug-apk:
    name: Compilación APK Debug con Motor C++20 y Firma Autónoma
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Descargar todo el código del proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 3. Configurar Android SDK y Aceptar Licencias
        run: |
          echo "=== Configurando entorno Android SDK ==="
          # En runners de GitHub Actions, el Android SDK ya reside en /usr/local/lib/android/sdk
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Añadir binarios de cmdline-tools y platform-tools al PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Aceptar todas las licencias de Android SDK de forma automática
          echo "Aceptando licencias del SDK..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 🛠️ 4. Instalar CMake y NDK para compilar C++20
        run: |
          echo "=== Instalando componentes nativos CMake 3.22.1 y NDK ==="
          # Instalar CMake 3.22.1 requerido por el proyecto
          sdkmanager --install "cmake;3.22.1" || true

          # AGP seleccionará automáticamente la versión de NDK compatible o se instala ndk;25.1.8937393
          sdkmanager --install "ndk;25.1.8937393" || true

          # Confirmar instalación
          if [ -d "$ANDROID_HOME/ndk/25.1.8937393" ]; then
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          fi

      - name: 💾 5. Configurar Caché de Gradle (Opcional)
        if: ${{ inputs.enable_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🔑 6. Generar firma de depuración desde cero
        run: |
          echo "=== Verificando / Generando firma debug.keystore limpia ==="
          if [ "${{ inputs.force_new_keystore }}" = "true" ] || [ ! -f "debug.keystore" ]; then
            echo "Eliminando cualquier keystore anterior y generando firma fresca desde cero..."
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=AuraMusicDebug, OU=Engineering, O=AuraSound, L=Local, ST=State, C=US"
            echo "✅ Firma debug.keystore creada exitosamente (RSA 2048 bits, validez 10.000 días)."
          else
            echo "Reutilizando firma debug.keystore existente."
          fi

      - name: 🔧 7. Preparar Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generando gradle wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: 🚀 8. Compilar APK Debug con motor DSP C++20
        run: |
          echo "Iniciando compilación de Aura Music Debug APK..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 📦 9. Publicar APK Debug como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

name: OpenCode Assistant (Zen & Muse Spark)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode-agent:
    name: OpenCode Agent (Muse Spark 1.3 Multimodal)
    # Concurrencia: cola por issue/PR (sin cancelación).
    # Causa raíz del bucle 3-5 comentarios / hasta 8 PRs:
    # - `group: ... || github.run_id` + `cancel-in-progress: true` hacía cada
    #   run único (sin exclusión mutua) y cancelaba runs a mitad de crear el PR,
    #   dejando ramas/PRs huérfanos. Con cola (`cancel-in-progress: false`) se
    #   garantiza: 1 comando = 1 run en cola = 1 PR.
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Filtro grueso anti-bucle (el job ni siquiera arranca con comentarios bot):
    # 1. Exige comando `/opencode` o `/oc` como en el flujo original.
    # 2. Bloquea tarjetas del propio bot aunque vengan vía PAT_TOKEN como
    #    usuario normal (`type: User`): `opencode.ai/s/`, `[opencode session]`,
    #    `Created PR #`, `actions/runs/`, `social-cards`.
    #    Sin esto, `contains(body,'/opencode')` era `true` en su propio
    #    comentario (la URL `https://opencode.ai/s/...` contiene el substring
    #    `/opencode` por la 2ª `/` de `://` + `opencode`) → cascada.
    if: |
      (github.event_name == 'issues' && (
        contains(github.event.issue.title || '', '/opencode') ||
        contains(github.event.issue.body || '', '/opencode') ||
        contains(github.event.issue.title || '', '/oc ') ||
        contains(github.event.issue.body || '', '/oc ') ||
        endsWith(github.event.issue.title || '', '/oc') ||
        endsWith(github.event.issue.body || '', '/oc')
      ) &&
        !contains(github.event.issue.title || '', 'opencode.ai/s/') &&
        !contains(github.event.issue.body || '', 'opencode.ai/s/') &&
        !contains(github.event.issue.title || '', '[opencode session]') &&
        !contains(github.event.issue.body || '', '[opencode session]') &&
        !contains(github.event.issue.title || '', 'Created PR #') &&
        !contains(github.event.issue.body || '', 'Created PR #') &&
        !contains(github.event.issue.title || '', 'actions/runs/') &&
        !contains(github.event.issue.body || '', 'actions/runs/') &&
        !contains(github.event.issue.title || '', 'social-cards') &&
        !contains(github.event.issue.body || '', 'social-cards')
      ) ||
      (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' && github.actor != 'github-actions[bot]' && (
        contains(github.event.comment.body || '', '/opencode') ||
        contains(github.event.comment.body || '', '/oc ') ||
        endsWith(github.event.comment.body || '', '/oc')
      ) &&
        !contains(github.event.comment.body || '', 'opencode.ai/s/') &&
        !contains(github.event.comment.body || '', '[opencode session]') &&
        !contains(github.event.comment.body || '', 'Created PR #') &&
        !contains(github.event.comment.body || '', 'actions/runs/') &&
        !contains(github.event.comment.body || '', 'social-cards')
      ) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot' && github.actor != 'github-actions[bot]' && (
        contains(github.event.comment.body || '', '/opencode') ||
        contains(github.event.comment.body || '', '/oc ') ||
        endsWith(github.event.comment.body || '', '/oc')
      ) &&
        !contains(github.event.comment.body || '', 'opencode.ai/s/') &&
        !contains(github.event.comment.body || '', '[opencode session]') &&
        !contains(github.event.comment.body || '', 'Created PR #') &&
        !contains(github.event.comment.body || '', 'actions/runs/') &&
        !contains(github.event.comment.body || '', 'social-cards')
      )
    permissions:
      contents: write
      pull-requests: write
      issues: write

    runs-on: ubuntu-latest
    steps:
      - name: Guardia anti-bucle (run_guard)
        id: run_guard
        shell: python3 {0}
        run: |
          import os, re

          event_name = os.environ.get("EVENT_NAME", "")
          issue_title = os.environ.get("ISSUE_TITLE", "") or ""
          issue_body = os.environ.get("ISSUE_BODY", "") or ""
          comment_body = os.environ.get("COMMENT_BODY", "") or ""
          comment_user_type = os.environ.get("COMMENT_USER_TYPE", "") or ""
          sender_type = os.environ.get("SENDER_TYPE", "") or ""
          actor = os.environ.get("ACTOR", "") or ""

          if event_name == "issues":
              text_raw = f"{issue_title}\n\n{issue_body}"
          else:
              text_raw = comment_body

          text_lower = text_raw.lower()
          bot_markers = [
              "opencode.ai/s/",
              "opencode.ai",
              "[opencode session]",
              "created pr #",
              "actions/runs/",
              "social-cards",
          ]
          found_marker = next((m for m in bot_markers if m in text_lower), None)

          should_run = True
          reason = "comando_valido"

          if found_marker:
              should_run = False
              reason = f"bot_marker:{found_marker}"
          elif comment_user_type == "Bot" or sender_type == "Bot":
              should_run = False
              reason = "sender_is_bot"
          elif actor == "github-actions[bot]" or actor.endswith("[bot]"):
              should_run = False
              reason = f"actor_is_bot:{actor}"
          else:
              # Limpia URLs antes de buscar el comando, para que
              # `https://opencode.ai/...` no cuente como `/opencode`.
              text_no_urls = re.sub(r"https?://\S+", "", text_raw)
              # Token aislado: ignora `/octubre`, `/opencv`, rutas, etc.
              if not re.search(r"(?:^|\s)/(oc|opencode)(?:\s|$|[,.:;!?])", text_no_urls, re.IGNORECASE):
                  should_run = False
                  reason = "sin_comando_aislado"

          print(f"run_guard: should_run={str(should_run).lower()} reason={reason}")
          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"should_run={str(should_run).lower()}\n")
                  f.write(f"reason={reason}\n")
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          ACTOR: ${{ github.actor }}

      - name: Checkout del código del repositorio
        if: steps.run_guard.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}   # <-- CAMBIO: tu PAT en lugar de GITHUB_TOKEN

      - name: Configurar identidad de Git para el Agente
        if: steps.run_guard.outputs.should_run == 'true'
        run: |
          git config --global user.name "${{ github.repository_owner }}"   # <-- CAMBIO: tu nombre de usuario
          git config --global user.email "${{ secrets.PAT_EMAIL }}"        # <-- CAMBIO: tu email (guárdalo como secret, o pon tu noreply: ID+usuario@users.noreply.github.com)

      - name: Configurar Node.js (Runtime oficial de OpenCode)
        if: steps.run_guard.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolver Prompt y Descargar Imágenes para OpenCode Multimodal
        if: steps.run_guard.outputs.should_run == 'true'
        id: prompt_resolver
        shell: python3 {0}
        run: |
          import os, re, urllib.request, mimetypes

          event_name = os.environ.get("EVENT_NAME", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")
          comment_body = os.environ.get("COMMENT_BODY", "")

          if event_name == "issues":
              raw_prompt = issue_title
              if issue_body:
                  raw_prompt += "\n\n" + issue_body
              if not raw_prompt.strip():
                  raw_prompt = "Revisa y resuelve el issue solicitado."
          else:
              raw_prompt = comment_body
              if not raw_prompt.strip():
                  raw_prompt = "Revisa y responde al comentario solicitado."

          img_pattern = re.compile(
              r'https?://(?:github\.com/user-attachments/assets/[a-zA-Z0-9_\-]+|user-images\.githubusercontent\.com/[^\s\)\"\'>]+|[^\s\)\"\'>]+\.(?:png|jpg|jpeg|webp|gif|svg)(?:\?[^\s\)\"\'>]*)?)',
              re.IGNORECASE
          )

          found_urls = img_pattern.findall(raw_prompt)
          seen = set()
          unique_urls = []
          for u in found_urls:
              if u not in seen:
                  seen.add(u)
                  unique_urls.append(u)

          downloaded_images = []
          if unique_urls:
              os.makedirs(".opencode/attachments", exist_ok=True)
              for idx, url in enumerate(unique_urls, 1):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0 (GitHubActions-OpenCodeAgent/1.0)"}
                      )
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          data = resp.read()
                          content_type = resp.headers.get_content_type()
                          ext = mimetypes.guess_extension(content_type) or ".png"
                          if ext == ".jpe":
                              ext = ".jpg"
                          local_path = f".opencode/attachments/imagen_{idx}{ext}"
                          with open(local_path, "wb") as f:
                              f.write(data)
                          downloaded_images.append((local_path, url))
                          print(f"✅ Imagen {idx} descargada exitosamente: {local_path} ({len(data)} bytes)")
                  except Exception as e:
                      print(f"⚠️ No se pudo descargar la imagen {url}: {e}")

          final_prompt = raw_prompt
          if downloaded_images:
              final_prompt += "\n\n---\n📸 [IMÁGENES / CAPTURAS ADJUNTAS DISPONIBLES LOCALMENTE]:\n"
              final_prompt += "El usuario adjuntó las siguientes imágenes en el issue/comentario. Están descargadas localmente en el repositorio para tu análisis visual:\n"
              for path, url in downloaded_images:
                  final_prompt += f"- Archivo local: `{path}` (URL original: {url})\n"
              final_prompt += "\nPor favor, utiliza tus herramientas de lectura y capacidades multimodales para revisar los archivos de imagen adjuntos, extraer detalles visuales, layouts o mensajes de error, y tenerlos en cuenta en tu respuesta e implementación de código.\n---"

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write("resolved_prompt<<EOF\n")
                  f.write(final_prompt + "\n")
                  f.write("EOF\n")
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Ejecutar OpenCode CLI con Muse Spark 1.3
        if: steps.run_guard.outputs.should_run == 'true'
        uses: anomalyco/opencode/github@latest
        with:
          use_github_token: true
          model: "opencode/muse-spark-1.3-contributor-free"
          prompt: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}          # <-- CAMBIO: tu PAT
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROMPT: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
          GIT_AUTHOR_NAME: ${{ github.repository_owner }}  # <-- CAMBIO: tu nombre
          GIT_AUTHOR_EMAIL: ${{ secrets.PAT_EMAIL }}       # <-- CAMBIO: tu email
          GIT_COMMITTER_NAME: ${{ github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ secrets.PAT_EMAIL }}

  cleanup-branch:
    name: Eliminar rama fusionada
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'opencode/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}   # <-- CAMBIO: tu PAT (necesario para borrar ramas)

      - name: Borrar rama remota temporal de OpenCode
        run: |
          echo "Borrando rama temporal fusionada: ${{ github.event.pull_request.head.ref }}"
          git push origin --delete "${{ github.event.pull_request.head.ref }}" || echo "La rama ya fue eliminada o no se pudo borrar."
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}   # <-- CAMBIO: tu PAT

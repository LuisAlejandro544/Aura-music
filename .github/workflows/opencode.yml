name: OpenCode Assistant (Zen & Muse Spark)

on:
  # Solo se activa con issues o comentarios de issues/pull requests
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Limpieza automática de la rama cuando se acepta y fusiona el Pull Request
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Job principal: Ejecución del agente OpenCode ante mención en Issue o Pull Request
  opencode-agent:
    name: OpenCode Agent (Muse Spark 1.3)
    if: |
      (github.event_name == 'issues' && (
        contains(github.event.issue.title, '/opencode') ||
        contains(github.event.issue.title, '/oc') ||
        contains(github.event.issue.body, '/opencode') ||
        contains(github.event.issue.body, '/oc')
      )) ||
      (github.event_name == 'issue_comment' && (
        contains(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, '/oc')
      )) ||
      (github.event_name == 'pull_request_review_comment' && (
        contains(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, '/oc')
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidad de Git para el Agente
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configurar Node.js (Runtime oficial de OpenCode)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolver Prompt para OpenCode
        id: prompt_resolver
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            COMBINED_PROMPT="$ISSUE_TITLE"
            if [ -n "$ISSUE_BODY" ]; then
              COMBINED_PROMPT="${COMBINED_PROMPT}"$'\n\n'"${ISSUE_BODY}"
            fi
            if [ -z "$COMBINED_PROMPT" ]; then
              COMBINED_PROMPT="Revisa y resuelve el issue solicitado."
            fi
            echo "resolved_prompt<<EOF" >> "$GITHUB_OUTPUT"
            echo "$COMBINED_PROMPT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            USER_COMMENT="$COMMENT_BODY"
            if [ -z "$USER_COMMENT" ]; then
              USER_COMMENT="Revisa y responde al comentario solicitado."
            fi
            echo "resolved_prompt<<EOF" >> "$GITHUB_OUTPUT"
            echo "$USER_COMMENT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Ejecutar OpenCode CLI con Muse Spark 1.3
        uses: anomalyco/opencode/github@latest
        with:
          use_github_token: true
          model: "opencode/muse-spark-1.3-contributor-free"
          prompt: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROMPT: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

  # Job secundario: Borrado automático de la rama tras aceptar y fusionar el Pull Request
  cleanup-branch:
    name: Eliminar rama fusionada
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'opencode/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Borrar rama remota temporal de OpenCode
        run: |
          echo "Borrando rama temporal fusionada: ${{ github.event.pull_request.head.ref }}"
          git push origin --delete "${{ github.event.pull_request.head.ref }}" || echo "La rama ya fue eliminada o no se pudo borrar."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

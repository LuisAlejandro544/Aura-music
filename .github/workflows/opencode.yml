name: OpenCode Assistant (Zen & Muse Spark)

# Corrección "Arreglo interno 2":
# - Un solo PR por pedido: gate anti-bots + comando estricto a inicio de línea
#   (evita que citas de coderabbitai[bot]/cloudflare[bot] re-disparen el flujo)
#   + serialización por issue (cancel-in-progress: false) + deduplicación
#   (si ya hay un PR opencode/* abierto para el issue, se reutiliza y no se crea otro).
# - Este workflow YA NO escucha `pull_request closed` (eso generaba runs fantasma
#   como "#109: Pull request #47 closed" en la lista de Actions). La limpieza de
#   ramas vive en `opencode-cleanup.yml`.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # Puerta de entrada: decide con Python si el evento es un comando humano real.
  # El `if:` de GitHub Expressions no tiene regex, por eso el filtro fino vive aquí.
  # Regla: el comando `/oc` o `/opencode` debe abrir una línea (tras espacios),
  # fuera de bloques de código ``` ``` y fuera de citas `>` (donde los bots
  # como coderabbitai citan el pedido original y causaban el bucle de 3-5 PRs).
  # ---------------------------------------------------------------------------
  guard:
    name: Puerta anti-duplicados y anti-bots
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
      issue_number: ${{ steps.eval.outputs.issue_number }}
      is_pr: ${{ steps.eval.outputs.is_pr }}
      reason: ${{ steps.eval.outputs.reason }}
    steps:
      - name: Evaluar comando y autor
        id: eval
        shell: python3 {0}
        run: |
          import os, re

          event = os.environ.get("EVENT_NAME", "")
          actor = os.environ.get("ACTOR", "")
          sender_type = os.environ.get("SENDER_TYPE", "")
          comment_user_type = os.environ.get("COMMENT_USER_TYPE", "")
          issue_number = os.environ.get("ISSUE_NUMBER", "") or os.environ.get("PR_NUMBER", "")
          is_pr = os.environ.get("IS_PR", "false")
          title = os.environ.get("ISSUE_TITLE", "") or ""
          issue_body = os.environ.get("ISSUE_BODY", "") or ""
          comment_body = os.environ.get("COMMENT_BODY", "") or ""

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")

          reason = ""
          should = False

          # 1. Bloqueo total de bots (causa raíz del bucle visto en la captura:
          #    runs "#111 created by coderabbitai[bot]" y "cloudflare-workers-and-pages[bot]").
          if sender_type == "Bot":
              reason = f"ignorado: sender '{actor}' es Bot"
          elif actor.endswith("[bot]") or actor == "github-actions[bot]":
              reason = f"ignorado: actor '{actor}' es bot"
          elif comment_user_type == "Bot":
              reason = "ignorado: autor del comentario es Bot"
          else:
              # 2. Texto a analizar según el evento.
              text = (title + "\n" + issue_body) if event == "issues" else comment_body
              # Quitar bloques de código ```...``` (los reviews de bots pegan el
              # comando dentro de snippets y el viejo `contains '/oc '` los tragaba).
              text_nocode = re.sub(r"```.*?```", "", text, flags=re.DOTALL)
              valid = False
              for raw_line in text_nocode.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith(">"):
                      continue  # cita de bot o línea vacía: no es comando
                  low = line  # comandos en minúsculas, sensibles a mayúsculas
                  if low == "/oc" or low.startswith("/oc ") or low.startswith("/oc\t"):
                      valid = True
                      break
                  if low == "/opencode" or low.startswith("/opencode ") or low.startswith("/opencode\t"):
                      valid = True
                      break
              if valid:
                  should = True
                  reason = "comando humano válido a inicio de línea"
              else:
                  reason = "ignorado: sin comando /oc u /opencode a inicio de línea (se ignoran citas, código y texto corrido)"

          out("should_run", "true" if should else "false")
          out("issue_number", issue_number)
          out("is_pr", is_pr)
          # Sanitizar reason a una línea para GITHUB_OUTPUT.
          out("reason", reason.replace("\n", " ")[:300])
          print(f"should_run={should} issue={issue_number} is_pr={is_pr} :: {reason}")
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PR: ${{ contains(github.event.issue.pull_request, 'url') }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

  opencode-agent:
    name: OpenCode Agent (Muse Spark 1.3 Multimodal)
    needs: guard
    # Solo corre con comando humano verificado por el job `guard`.
    if: needs.guard.outputs.should_run == 'true'
    # Serialización por issue/PR: los pedidos seguidos se encolan (NO se cancelan
    # ni corren en paralelo), así no se crean N ramas/PRs a la vez. El gate de
    # deduplicación de abajo convierte los runs encolados en "reutilizar PR".
    # (Sin fallback a run_id: ese fallback rompía el agrupamiento y permitía
    # los 5 PRs paralelos de la captura.)
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configurar identidad de Git para el Agente
        run: |
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ secrets.PAT_EMAIL }}"

      # -----------------------------------------------------------------------
      # Deduplicación 1-en-1: si ya existe un PR abierto `opencode/issue<N>-*`
      # para este issue, NO se crea otro (el action `opencode github run` crea
      # una rama con timestamp por run, esa era la fuente de los "5 PRs").
      # En comentarios sobre PR (is_pr=true) no aplica: ahí OpenCode commitea
      # sobre el mismo PR y no crea uno nuevo.
      # -----------------------------------------------------------------------
      - name: Deduplicar PR abierto existente
        id: dedupe
        if: needs.guard.outputs.is_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Buscando PRs abiertos opencode/issue${ISSUE_NUMBER}-* ..."
          EXISTING=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" --jq \
            "[.[] | select(.head.ref | startswith(\"opencode/issue${ISSUE_NUMBER}-\")) | {number, head: .head.ref}] | sort_by(.number) | reverse | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Ya existe el PR #$EXISTING para el issue #$ISSUE_NUMBER: se reutiliza y no se crea otro."
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "♻️ Ya existe el PR #$EXISTING para este pedido (run $RUN_ID). OpenCode trabajará sobre ese PR en lugar de abrir uno duplicado." || true
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Sin PR previo: se procede a crear uno."
          fi

      - name: Reaccionar al comentario (acuse de recibo)
        if: steps.dedupe.outputs.skip != 'true' && github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content='eyes' || true

      - name: Configurar Node.js (Runtime oficial de OpenCode)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolver Prompt y Descargar Imágenes para OpenCode Multimodal
        id: prompt_resolver
        if: steps.dedupe.outputs.skip != 'true'
        shell: python3 {0}
        run: |
          import os, re, urllib.request, mimetypes

          event_name = os.environ.get("EVENT_NAME", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")
          comment_body = os.environ.get("COMMENT_BODY", "")

          if event_name == "issues":
              raw_prompt = issue_title
              if issue_body:
                  raw_prompt += "\n\n" + issue_body
              if not raw_prompt.strip():
                  raw_prompt = "Revisa y resuelve el issue solicitado."
          else:
              raw_prompt = comment_body
              if not raw_prompt.strip():
                  raw_prompt = "Revisa y responde al comentario solicitado."

          img_pattern = re.compile(
              r'https?://(?:github\.com/user-attachments/assets/[a-zA-Z0-9_\-]+|user-images\.githubusercontent\.com/[^\s\)\"\'>]+|[^\s\)\"\'>]+\.(?:png|jpg|jpeg|webp|gif|svg)(?:\?[^\s\)\"\'>]*)?)',
              re.IGNORECASE
          )

          found_urls = img_pattern.findall(raw_prompt)
          seen = set()
          unique_urls = []
          for u in found_urls:
              if u not in seen:
                  seen.add(u)
                  unique_urls.append(u)

          downloaded_images = []
          if unique_urls:
              os.makedirs(".opencode/attachments", exist_ok=True)
              for idx, url in enumerate(unique_urls, 1):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0 (GitHubActions-OpenCodeAgent/1.0)"}
                      )
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          data = resp.read()
                          content_type = resp.headers.get_content_type()
                          ext = mimetypes.guess_extension(content_type) or ".png"
                          if ext == ".jpe":
                              ext = ".jpg"
                          local_path = f".opencode/attachments/imagen_{idx}{ext}"
                          with open(local_path, "wb") as f:
                              f.write(data)
                          downloaded_images.append((local_path, url))
                          print(f"✅ Imagen {idx} descargada exitosamente: {local_path} ({len(data)} bytes)")
                  except Exception as e:
                      print(f"⚠️ No se pudo descargar la imagen {url}: {e}")

          final_prompt = raw_prompt
          if downloaded_images:
              final_prompt += "\n\n---\n📸 [IMÁGENES / CAPTURAS ADJUNTAS DISPONIBLES LOCALMENTE]:\n"
              final_prompt += "El usuario adjuntó las siguientes imágenes en el issue/comentario. Están descargadas localmente en el repositorio para tu análisis visual:\n"
              for path, url in downloaded_images:
                  final_prompt += f"- Archivo local: `{path}` (URL original: {url})\n"
              final_prompt += "\nPor favor, utiliza tus herramientas de lectura y capacidades multimodales para revisar los archivos de imagen adjuntos, extraer detalles visuales, layouts o mensajes de error, y tenerlos en cuenta en tu respuesta e implementación de código.\n---"

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write("resolved_prompt<<EOF\n")
                  f.write(final_prompt + "\n")
                  f.write("EOF\n")
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Ejecutar OpenCode CLI con Muse Spark 1.3
        if: steps.dedupe.outputs.skip != 'true'
        uses: anomalyco/opencode/github@latest
        with:
          use_github_token: true
          model: "opencode/muse-spark-1.3-contributor-free"
          prompt: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROMPT: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
          GIT_AUTHOR_NAME: ${{ github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ secrets.PAT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ secrets.PAT_EMAIL }}

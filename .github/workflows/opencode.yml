name: OpenCode Assistant (Zen & Muse Spark)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Una sola ejecución por issue/PR a la vez: las peticiones extra se encolan
# en vez de ejecutarse en paralelo (evita N comentarios y N PRs duplicados).
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    name: Filtro anti-bucle y anti-duplicados
    # Nunca reaccionar a actores bot (incluye los avisos "Created PR #N"
    # y "[opencode session]" que publica la propia Action).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Evaluar si el evento es un comando real /oc o /opencode
        id: check
        shell: python3 {0}
        run: |
          import os, re

          event_name = "${{ github.event_name }}"
          actor = "${{ github.actor }}"
          sender_type = "${{ github.event.sender.type }}"
          comment_user_type = "${{ github.event.comment.user.type }}"
          comment_body = os.environ.get("COMMENT_BODY", "") or ""
          issue_title = os.environ.get("ISSUE_TITLE", "") or ""
          issue_body = os.environ.get("ISSUE_BODY", "") or ""

          # Firmas que publica el propio agente: jamás deben re-disparar el flujo.
          # Nota: la tarjeta social "social-cards.sst.dev/opencode-share/..." contiene
          # el substring "/oc", por eso el antiguo `contains(body, '/oc')` entraba en bucle.
          BOT_SIGNATURES = ("opencode-share", "opencode session", "Created PR #", "github run")

          def is_bot_authored() -> bool:
              if actor == "github-actions[bot]":
                  return True
              if sender_type == "Bot":
                  return True
              if event_name in ("issue_comment", "pull_request_review_comment"):
                  if comment_user_type == "Bot":
                      return True
              text = (comment_body + "\n" + issue_title + "\n" + issue_body).lower()
              return any(s.lower() in text and event_name != "issues" for s in BOT_SIGNATURES)

          # Comando válido: /oc o /opencode como palabra independiente,
          # p. ej. "/oc haz esto", "por favor /oc arregla", "/opencode\n...".
          # Exige un delimitador (espacio, salto o fin de texto) tras el comando,
          # así "/opencode-share" o "https://opencode.ai/s/..." NO coinciden.
          CMD = re.compile(r"(^|\s)/(oc|opencode)(?=\s|$)", re.IGNORECASE)

          should_run = "false"
          if not is_bot_authored():
              if event_name == "issues":
                  if CMD.search(issue_title) or CMD.search(issue_body):
                      should_run = "true"
              elif event_name in ("issue_comment", "pull_request_review_comment"):
                  if CMD.search(comment_body):
                      # Doble red: aunque el autor no sea bot, ignorar avisos del agente.
                      lowered = comment_body.lower()
                      if not any(s.lower() in lowered for s in BOT_SIGNATURES):
                          should_run = "true"
              print(f"event={event_name} actor={actor} should_run={should_run}")
          else:
              print(f"event={event_name} actor={actor} ignorado por firma/autor bot")

          issue_number = "${{ github.event.issue.number }}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={should_run}\n")
              f.write(f"issue_number={issue_number}\n")
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
  opencode-agent:
    name: OpenCode Agent (Muse Spark 1.3 Multimodal)
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}   # <-- CAMBIO: tu PAT en lugar de GITHUB_TOKEN

      - name: Configurar identidad de Git para el Agente
        run: |
          git config --global user.name "${{ github.repository_owner }}"   # <-- CAMBIO: tu nombre de usuario
          git config --global user.email "${{ secrets.PAT_EMAIL }}"        # <-- CAMBIO: tu email (guárdalo como secret, o pon tu noreply: ID+usuario@users.noreply.github.com)

      - name: Configurar Node.js (Runtime oficial de OpenCode)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolver Prompt y Descargar Imágenes para OpenCode Multimodal
        id: prompt_resolver
        shell: python3 {0}
        run: |
          import os, re, urllib.request, mimetypes

          event_name = os.environ.get("EVENT_NAME", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")
          comment_body = os.environ.get("COMMENT_BODY", "")

          if event_name == "issues":
              raw_prompt = issue_title
              if issue_body:
                  raw_prompt += "\n\n" + issue_body
              if not raw_prompt.strip():
                  raw_prompt = "Revisa y resuelve el issue solicitado."
          else:
              raw_prompt = comment_body
              if not raw_prompt.strip():
                  raw_prompt = "Revisa y responde al comentario solicitado."

          img_pattern = re.compile(
              r'https?://(?:github\.com/user-attachments/assets/[a-zA-Z0-9_\-]+|user-images\.githubusercontent\.com/[^\s\)\"\'>]+|[^\s\)\"\'>]+\.(?:png|jpg|jpeg|webp|gif|svg)(?:\?[^\s\)\"\'>]*)?)',
              re.IGNORECASE
          )

          found_urls = img_pattern.findall(raw_prompt)
          seen = set()
          unique_urls = []
          for u in found_urls:
              if u not in seen:
                  seen.add(u)
                  unique_urls.append(u)

          downloaded_images = []
          if unique_urls:
              os.makedirs(".opencode/attachments", exist_ok=True)
              for idx, url in enumerate(unique_urls, 1):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0 (GitHubActions-OpenCodeAgent/1.0)"}
                      )
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          data = resp.read()
                          content_type = resp.headers.get_content_type()
                          ext = mimetypes.guess_extension(content_type) or ".png"
                          if ext == ".jpe":
                              ext = ".jpg"
                          local_path = f".opencode/attachments/imagen_{idx}{ext}"
                          with open(local_path, "wb") as f:
                              f.write(data)
                          downloaded_images.append((local_path, url))
                          print(f"✅ Imagen {idx} descargada exitosamente: {local_path} ({len(data)} bytes)")
                  except Exception as e:
                      print(f"⚠️ No se pudo descargar la imagen {url}: {e}")

          final_prompt = raw_prompt
          if downloaded_images:
              final_prompt += "\n\n---\n📸 [IMÁGENES / CAPTURAS ADJUNTAS DISPONIBLES LOCALMENTE]:\n"
              final_prompt += "El usuario adjuntó las siguientes imágenes en el issue/comentario. Están descargadas localmente en el repositorio para tu análisis visual:\n"
              for path, url in downloaded_images:
                  final_prompt += f"- Archivo local: `{path}` (URL original: {url})\n"
              final_prompt += "\nPor favor, utiliza tus herramientas de lectura y capacidades multimodales para revisar los archivos de imagen adjuntos, extraer detalles visuales, layouts o mensajes de error, y tenerlos en cuenta en tu respuesta e implementación de código.\n---"

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write("resolved_prompt<<EOF\n")
                  f.write(final_prompt + "\n")
                  f.write("EOF\n")
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Ejecutar OpenCode CLI con Muse Spark 1.3
        uses: anomalyco/opencode/github@latest
        with:
          use_github_token: true
          model: "opencode/muse-spark-1.3-contributor-free"
          prompt: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}          # <-- CAMBIO: tu PAT
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROMPT: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
          GIT_AUTHOR_NAME: ${{ github.repository_owner }}  # <-- CAMBIO: tu nombre
          GIT_AUTHOR_EMAIL: ${{ secrets.PAT_EMAIL }}       # <-- CAMBIO: tu email
          GIT_COMMITTER_NAME: ${{ github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ secrets.PAT_EMAIL }}

  cleanup-branch:
    name: Eliminar rama fusionada
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'opencode/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}   # <-- CAMBIO: tu PAT (necesario para borrar ramas)

      - name: Borrar rama remota temporal de OpenCode
        run: |
          echo "Borrando rama temporal fusionada: ${{ github.event.pull_request.head.ref }}"
          git push origin --delete "${{ github.event.pull_request.head.ref }}" || echo "La rama ya fue eliminada o no se pudo borrar."
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}   # <-- CAMBIO: tu PAT
          
